[package]
name = "desktop"
version = "0.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
# Reads `src/features/*/feature.json` so each feature gets its inlined plugin permissions.
serde_json = "1"

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", features = ["macos_fsevent"] }
fontdb = "0.24"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["fs", "sync", "net", "time", "rt", "macros"] }
parking_lot = "0.13"
keyring = "4"
thiserror = "2"
log = "0.4"
trash = "5"
base64 = "0.23"
tauri-plugin-store = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-single-instance = "2.5"
tauri-plugin-webdriver = { version = "0.2", optional = true }
# Telemetry transport. Feature set mirrors tauri-plugin-updater's so the
# dependency graph does not grow — both are already resolved in Cargo.lock.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
url = "2"
sha2 = "0.11"
# Vault index (Bases phase 0): SQLite cache + lenient YAML event parser.
rusqlite = { version = "0.43", features = ["bundled"] }
yaml-rust2 = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Bases regexp literals (`/abc/i`); was dev-only.
regex-lite = "0.1"
# Local diagnostic logs (ADR 2026-11-16): one subscriber, JSON lines, daily files, 3-file cap,
# non-blocking writer. `log` records (already used across the crate) are bridged in by the
# `tracing-log` feature. Exact pins on purpose; tracing/tracing-core were already resolved
# through tauri, so the added graph is tracing-subscriber + tracing-appender (+ their few deps).
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = [
  "std",
  "fmt",
  "registry",
  "json",
  "tracing-log",
] }
tracing-appender = "=0.2.5"
tracing-log = { version = "=0.2.0", default-features = false, features = ["log-tracer", "std"] }
unicode-normalization = "0.1.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", features = ["exception"] }
block2 = "0.6.2"

[features]
# Embeds a W3C WebDriver server in the app for local E2E testing with
# `tauri-webdriver` + WebdriverIO. Never enable this for release builds.
e2e = ["dep:tauri-plugin-webdriver"]

[dev-dependencies]
tempfile = "3"
regex-lite = "0.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
