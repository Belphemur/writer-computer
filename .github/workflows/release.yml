name: Release

# A pushed v* tag builds macOS arm64 and Linux x86_64 and leaves a DRAFT release for the maintainer
# to review and publish (ADR 2026-11-23). Nothing here publishes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Releases are cut from this branch only.
  RELEASE_BRANCH: writer-computer-agents

jobs:
  # Everything that can fail cheaply fails here, before an hour of builds.
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - name: Tag matches the version files
        id: check
        run: node scripts/release.mjs check --tag "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      - name: Tagged commit is on the release branch
        run: |
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$RELEASE_BRANCH"; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on $RELEASE_BRANCH. Tag a commit of that branch."
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: node scripts/release.mjs notes --version "${{ steps.check.outputs.version }}" > release-notes.md
      - name: Updater signing key is configured
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The secret TAURI_SIGNING_PRIVATE_KEY is not set: the updater artifacts cannot be signed."
            exit 1
          fi
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-aarch64, os: macos-latest }
          - { platform: linux-x86_64, os: ubuntu-26.04 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: ./.github/actions/setup-writer
      - name: macOS signing mode
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        # With all six Developer ID secrets the build signs and notarizes; with none it is ad-hoc
        # signed ("-"). The variables are exported only in the first case: an empty
        # APPLE_CERTIFICATE would make Tauri try to import a certificate.
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ] \
            && [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              delimiter="ghadelim_$(uuidgen)"
              { echo "$name<<$delimiter"; printenv "$name"; echo "$delimiter"; } >> "$GITHUB_ENV"
            done
            echo "::notice::macOS build is signed with the Developer ID and notarized."
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::notice::macOS build is ad-hoc signed (no Developer ID secrets)."
          fi
      - name: Telemetry
        env:
          WRITER_POSTHOG_KEY: ${{ secrets.WRITER_POSTHOG_KEY }}
        # The key is optional: without it the build compiles telemetry out (docs/telemetry.md).
        run: |
          if [ -n "$WRITER_POSTHOG_KEY" ]; then
            echo "WRITER_POSTHOG_KEY=$WRITER_POSTHOG_KEY" >> "$GITHUB_ENV"
            echo "::notice::Build includes the telemetry key."
          else
            echo "::notice::Build has telemetry off (no key)."
          fi
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy's bundled strip cannot read binaries of current distributions.
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
        # The bundle list is per OS in tauri.macos.conf.json and tauri.linux.conf.json.
        run: pnpm --filter desktop exec tauri build
      - name: Collect the assets
        run: node scripts/release.mjs collect --platform "${{ matrix.platform }}" --out release-assets
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: assets-${{ matrix.platform }}
          path: release-assets
          if-no-files-found: error

  draft:
    name: Draft release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/download-artifact@v4.3.0
        with:
          pattern: assets-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4.3.0
        with:
          name: release-notes
      - name: Merge latest.json
        run: node scripts/release.mjs manifest --dir release-assets --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes release-notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "Writer $GITHUB_REF_NAME" --notes-file release-notes.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # A draft has no tag page yet, so the URL comes from the create call itself.
          if ! url=$(gh release create "$GITHUB_REF_NAME" release-assets/* "${flags[@]}"); then
            echo "::error::Could not create the draft. If a release for $GITHUB_REF_NAME already exists, delete it first (docs/releasing.md)."
            exit 1
          fi
          echo "Draft: $url" | tee -a "$GITHUB_STEP_SUMMARY"
